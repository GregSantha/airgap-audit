name: CI/CD Pipeline

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-lint:
    name: Linting & Formatting
    runs-on: ubuntu-24.04
    # Only run on manual trigger, or PRs containing the 'run-ci' label
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-ci'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Linting & Formatting Tools
        run: |
          # TODO

  ci-build-arm64:
    name: Build ARM64 Binaries
    runs-on: ubuntu-24.04-arm
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-ci'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ARM64 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libdrm-dev libinput-dev

      - name: Build ARM64 Binaries
        run: |
          cmake --preset arm64-release
          cmake --build --preset arm64-release -j$(nproc)

      - name: Upload ARM64 Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: lvgl_gui_binary
          path: |
            build/arm64-release/src/lvgl_gui

  ci-release:
    name: Create GitHub Release
    needs: [ci-build-x64, ci-build-arm64]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download ARM64 Artifacts
        uses: actions/download-artifact@v6
        with:
          name: lvgl_gui_binary
          path: ./arm64-dist

      - name: Prepare Release Binaries
        run: |
          cp ./arm64-dist/lvgl_gui ./lvgl_gui
          chmod +x ./lvgl_gui

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lvgl_gui
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
