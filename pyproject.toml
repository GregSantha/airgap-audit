[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airgap-audit"
version = "0.2.0"
description = "Offline USB update engine and binary security auditor for embedded Linux applications (ARMv8)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Security Engineer" }
]
dependencies = [
    "cryptography>=43.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
airgap-audit = "airgap_audit.cli:main"
airgap-updater = "airgap_audit.companion.updater:main"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
